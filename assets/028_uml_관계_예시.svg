<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="1000" height="480" fill="#1e1e1e"/>

  <defs>
    <marker id="openArrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#7fa8d9" stroke-width="1.5"/>
    </marker>
    <marker id="hollowTriangle" markerWidth="20" markerHeight="16" refX="16" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 Z" fill="#1e1e1e" stroke="#7fa8d9" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- edges (drawn first, boxes/diamonds drawn on top) -->

  <!-- 정비사 -> 자동차 (dotted, dependency) -->
  <line x1="220" y1="130" x2="326" y2="130" stroke="#7fa8d9" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#openArrow)"/>

  <!-- 정비사 -> 공구 (dotted, dependency) -->
  <line x1="130" y1="155" x2="130" y2="301" stroke="#7fa8d9" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#openArrow)"/>

  <!-- 자동차 -> 엔진 (composition) -->
  <line x1="520" y1="120" x2="796" y2="120" stroke="#cfe0f5" stroke-width="2" marker-end="url(#openArrow)"/>
  <line x1="410" y1="120" x2="490" y2="120" stroke="#cfe0f5" stroke-width="2"/>

  <!-- 자동차 -> 블랙박스 (composition) -->
  <line x1="410" y1="185" x2="410" y2="326" stroke="#cfe0f5" stroke-width="2" marker-end="url(#openArrow)"/>

  <!-- 블랙박스 -> 블박용메모리 (association) -->
  <line x1="520" y1="355" x2="796" y2="360" stroke="#cfe0f5" stroke-width="2" marker-end="url(#openArrow)"/>

  <!-- 블박용메모리 -> 메모리 (IS-A, hollow triangle) -->
  <line x1="890" y1="335" x2="882" y2="204" stroke="#7fa8d9" stroke-width="2" marker-end="url(#hollowTriangle)"/>

  <!-- diamonds -->
  <!-- filled diamond: 자동차-엔진 -->
  <polygon points="490,120 505,105 520,120 505,135" fill="#4a7fc9" stroke="#cfe0f5" stroke-width="1.5"/>
  <!-- filled diamond: 자동차-블랙박스 -->
  <polygon points="410,155 425,170 410,185 395,170" fill="#4a7fc9" stroke="#cfe0f5" stroke-width="1.5"/>
  <!-- hollow diamond: 블랙박스-블박용메모리 -->
  <polygon points="490,355 505,340 520,355 505,370" fill="#1e1e1e" stroke="#cfe0f5" stroke-width="1.5"/>

  <!-- boxes -->
  <g font-size="20" fill="#ffffff" text-anchor="middle">
    <rect x="40" y="105" width="180" height="50" rx="4" fill="#4a7fc9" stroke="#e8eef7" stroke-width="2"/>
    <text x="130" y="137">정비사</text>

    <rect x="330" y="105" width="160" height="50" rx="4" fill="#4a7fc9" stroke="#e8eef7" stroke-width="2"/>
    <text x="410" y="137">자동차</text>

    <rect x="800" y="95" width="160" height="50" rx="4" fill="#4a7fc9" stroke="#e8eef7" stroke-width="2"/>
    <text x="880" y="127">엔진</text>

    <rect x="40" y="305" width="180" height="50" rx="4" fill="#4a7fc9" stroke="#e8eef7" stroke-width="2"/>
    <text x="130" y="337">공구</text>

    <rect x="330" y="330" width="160" height="50" rx="4" fill="#4a7fc9" stroke="#e8eef7" stroke-width="2"/>
    <text x="410" y="362">블랙박스</text>

    <rect x="800" y="335" width="180" height="50" rx="4" fill="#4a7fc9" stroke="#e8eef7" stroke-width="2"/>
    <text x="890" y="367" fill="#f2ea6b">블박용메모리</text>

    <rect x="800" y="150" width="160" height="50" rx="4" fill="#4a7fc9" stroke="#e8eef7" stroke-width="2"/>
    <text x="880" y="182">메모리</text>
  </g>

  <g font-size="14" fill="#9fb8d8">
    <text x="240" y="118">의존</text>
    <text x="60" y="235">의존</text>
    <text x="420" y="470">실선 + 꽉 찬 마름모 = Composition · 실선 + 빈 마름모 = Association · 점선 = 의존 · 속이 빈 삼각형 = IS-A(상속)</text>
  </g>
</svg>
