name: Update README

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate README from note list
        run: |
          export LC_ALL=C.UTF-8
          shopt -s globstar
          latest=$(ls **/[0-9][0-9][0-9]_*.md 2>/dev/null | sort | tail -1)
          if [ -z "$latest" ]; then
            echo "번호 형식 노트가 없어 README를 갱신하지 않습니다."
            exit 0
          fi
          {
            echo "# 백엔드 스터디 노트"
            echo
            echo "> 매일 배운 내용을 마크다운으로 정리하는 저장소입니다."
            echo
            echo "## 🗂 전체 노트"
            echo
            for dir in $(ls -d [0-9][0-9]_*/ 2>/dev/null | sort); do
              base=${dir%/}
              num=${base%%_*}
              name=${base#*_}
              name=${name//_/ }
              echo "<details>"
              echo "<summary>${num}. ${name}</summary>"
              echo
              echo "\`${base}/\`"
              for sub in 노트 실습 오답노트 참고자료; do
                [ -d "${base}/${sub}" ] || continue
                shopt -u nullglob
                files=("${base}/${sub}"/[0-9][0-9][0-9]_*.md)
                [ -e "${files[0]}" ] || continue
                echo
                echo "**${sub}**"
                echo
                for f in "${files[@]}"; do
                  echo "- [${f%.md}](<./$f>)"
                done
              done
              echo
              echo "</details>"
              echo
            done
          } > README.md

      - name: Commit README if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "docs: README 자동 갱신" && git push)
